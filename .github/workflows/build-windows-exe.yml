name: Build Windows EXE v4
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Buncombe_MSD_DXF_v4 buncombe_msd_to_dxf_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: Buncombe_MSD_DXF_v4_Windows
          path: dist/Buncombe_MSD_DXF_v4.exe
