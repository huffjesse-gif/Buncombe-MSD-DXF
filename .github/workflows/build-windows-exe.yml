name: Build Windows EXE v3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Buncombe_MSD_DXF_v3 buncombe_msd_to_dxf_v3.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Buncombe_MSD_DXF_v3_Windows
          path: dist/Buncombe_MSD_DXF_v3.exe
